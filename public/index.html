<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سعودي AI</title>
<meta name="google-adsense-account" content="ca-pub-1829540228262969">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
/* سعودي AI — هوية: أخضر العلم، نحاس الدلّة، وشريط مستوحى من نسيج السدو */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2ef;--panel:#ffffff;--ink:#132019;--mute:#5f6e66;--line:#d7e0da;
--accent:#006c35;--accent-ink:#ffffff;--accent-soft:#e1efe6;--brass:#b8892b;--user:#e1efe6;--canvas:#e4eae6;--danger:#9b2c2c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1612;--panel:#142019;--ink:#e9f0ec;--mute:#93a59b;--line:#24342b;
--accent:#2fb36b;--accent-ink:#06150d;--accent-soft:#183326;--brass:#d6a947;--user:#183326;--canvas:#0a120e;--danger:#e07a7a}}
:root[data-theme="dark"]{--bg:#0d1612;--panel:#142019;--ink:#e9f0ec;--mute:#93a59b;--line:#24342b;
--accent:#2fb36b;--accent-ink:#06150d;--accent-soft:#183326;--brass:#d6a947;--user:#183326;--canvas:#0a120e;--danger:#e07a7a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
font:15px/1.65 "IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* الرأس */
header{display:flex;align-items:center;gap:20px;padding:12px 20px;background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.brand .mark svg{width:20px;height:20px}
.brand b{font:700 1.35rem/1 "Reem Kufi","IBM Plex Sans Arabic",sans-serif;letter-spacing:0}
.brand small{font:600 .8rem/1 "IBM Plex Sans Arabic",sans-serif;color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:6px;direction:ltr}
nav.main{display:flex;gap:2px;margin-inline-start:auto;background:var(--bg);padding:3px;border-radius:12px}
nav.main button,nav.main a{font:500 .92rem/1 inherit;font-family:inherit;border:0;background:transparent;color:var(--mute);padding:9px 14px;border-radius:9px;text-decoration:none;cursor:pointer;white-space:nowrap}
nav.main button:hover,nav.main a:hover{color:var(--ink)}
nav.main button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(19,32,25,.12)}
.sadu{height:6px;flex:none;background:
linear-gradient(135deg,var(--brass) 25%,transparent 25%) 0 0/12px 6px,
linear-gradient(225deg,var(--brass) 25%,transparent 25%) 0 0/12px 6px,
var(--accent)}

/* أزرار عامة */
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 13px}
button:hover:not(:disabled){border-color:var(--mute)}
button.on,#send{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:11px}
.seg button{border:0;background:transparent;color:var(--mute);padding:5px 12px;border-radius:8px;font-size:.88rem}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(19,32,25,.12)}

/* شريط الأدوات: المحرك + المشروع في سطر واحد */
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
#enginebar{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute)}
#projbar{display:flex;gap:6px;flex:1;min-width:240px;max-width:560px;margin-inline-start:auto}
#proj{flex:1;min-width:0;font:inherit;font-size:.9rem;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
#projbar button{font-size:.88rem}
#del{color:var(--mute)}
body[data-mode=chat] #proj,body[data-mode=chat] #del,body[data-mode=image] #proj,body[data-mode=image] #del{display:none}
body[data-mode=image] #enginebar{display:none}
#imgbar{display:none;align-items:center;gap:8px;font-size:.85rem;color:var(--mute)}
body[data-mode=image] #imgbar{display:flex}
#imgbar select{font:inherit;font-size:.88rem;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
#base{display:none;align-items:center;gap:8px;margin:0 16px 8px;padding:6px 8px;border:1px solid var(--line);border-radius:12px;font-size:.84rem;color:var(--mute);background:var(--panel)}
#base.show{display:flex}
#base img{width:40px;height:40px;object-fit:cover;border-radius:8px}
#base button{margin-inline-start:auto;font-size:.8rem;padding:3px 9px}
.m.img{white-space:normal}
.m.img img{display:block;max-width:100%;max-height:60vh;border-radius:12px;margin-bottom:8px;background:var(--canvas)}
.m.img .acts{display:flex;gap:6px;flex-wrap:wrap}
.m.img .acts button{font-size:.82rem;padding:4px 10px}
body[data-mode=chat] #projbar,body[data-mode=image] #projbar{flex:none;min-width:0}
#banner{display:none;padding:9px 20px;font-size:.88rem;background:#5a1f1f;color:#fff}
#banner.show{display:block}

/* المساحة الرئيسية */
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(320px,2fr) 3fr}
#chatp{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-inline-end:1px solid var(--line)}
.log{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-start;background:var(--user);border-start-start-radius:4px}
.m.a{align-self:flex-end;background:var(--bg);border-start-end-radius:4px}
#chips,#chipsChat,#chipsImage{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 10px}
#chips button,#chipsChat button,#chipsImage button{font-size:.84rem;border-radius:99px;color:var(--mute);background:transparent;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chips button:hover,#chipsChat button:hover,#chipsImage button:hover{color:var(--ink);background:var(--accent-soft);border-color:var(--accent-soft)}
.comp{display:flex;gap:8px;align-items:flex-end;margin:0 16px 16px;padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.comp:focus-within{border-color:var(--accent)}
textarea{flex:1;resize:none;font:inherit;color:inherit;background:transparent;border:0;padding:6px 8px;max-height:140px;outline:none}
#send{border-radius:11px;padding:9px 18px;font-weight:600}

/* المعاينة: التطبيق يظهر كصفحة على لوحة */
#prev{display:flex;flex-direction:column;min-height:0;position:relative;background:var(--canvas);
background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.bar{display:flex;gap:6px;align-items:center;padding:10px 16px}
.bar [data-v]{border:0;background:transparent;color:var(--mute);padding:6px 12px}
.bar [data-v].on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(19,32,25,.12)}
.bar .sp{flex:1}
#dl,#pub{background:var(--panel)}
#sync{font-size:.8rem;color:var(--mute);white-space:nowrap}
#sync.err{color:var(--danger)}
#pubbar{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:0 16px 10px;padding:8px 12px;border-radius:12px;background:var(--accent-soft);font-size:.86rem}
#pubbar.show{display:flex}
#pubbar a{color:var(--accent);direction:ltr;overflow-wrap:anywhere;font-weight:600}
#pubbar button{font-size:.8rem;padding:3px 10px}
#who{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--mute)}
#who a{color:var(--mute)}
@media (max-width:800px){#who{display:none}}
#frame,#code,#brief{flex:1;margin:0 16px 16px;border-radius:14px;border:1px solid var(--line);box-shadow:0 10px 30px -18px rgba(19,32,25,.45)}
#frame{width:calc(100% - 32px);background:#fff}
#code{padding:14px;overflow:auto;direction:ltr;text-align:left;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;background:var(--panel)}
#brief{padding:14px 16px;resize:none;font-family:inherit;font-size:14px;line-height:1.8;color:var(--ink);background:var(--panel);outline:none;max-height:none}
#brief:focus{border-color:var(--accent)}
.brief-note{margin:0 16px 8px;font-size:.82rem;color:var(--mute)}
#empty{position:absolute;inset:56px 16px 16px;display:grid;place-items:center;align-content:center;gap:6px;color:var(--mute);text-align:center;padding:20px;pointer-events:none;border:1.5px dashed var(--line);border-radius:14px}
#empty b{font:700 1.15rem "Reem Kufi","IBM Plex Sans Arabic",sans-serif;color:var(--ink)}
#tabs{display:none;gap:6px;padding:8px;border-top:1px solid var(--line);background:var(--panel)}
#tabs button{flex:1}

body[data-mode=chat] main,body[data-mode=image] main{grid-template-columns:1fr}
body[data-mode=image] #chatp,body[data-mode=chat] #chatp{max-width:820px;width:100%;margin:0 auto;border:0;background:transparent}
body[data-mode=chat] .m.a,body[data-mode=image] .m.a{background:var(--panel)}
body[data-mode=chat] #prev,body[data-mode=image] #prev{display:none}

@media (max-width:800px){
header{gap:10px;padding:10px 12px;flex-wrap:wrap}
nav.main{margin-inline-start:0;width:100%;overflow-x:auto}
nav.main button,nav.main a{flex:1;padding:9px 8px;text-align:center}
#toolbar{padding:8px 12px}
#projbar{min-width:100%;margin:0}
main{grid-template-columns:1fr}
.log{padding:14px}
body[data-mode=build] #tabs{display:flex}
body[data-mode=build][data-pane=chat] #prev{display:none}
body[data-mode=build][data-pane=preview] #chatp{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const $=s=>document.querySelector(s),D=document.body,F='\x60\x60\x60';
const logs={build:$('#log-build'),chat:$('#log-chat'),image:$('#log-image')},inp=$('#inp'),frame=$('#frame'),codeEl=$('#code'),briefEl=$('#brief');
const hints={build:'صف التطبيق الذي تريده، أو اطلب تعديلًا على الحالي…',chat:'اسأل أي شيء…',image:'صف الصورة التي تريدها، أو اطلب تعديلًا على الصورة المختارة…'};let baseImg=null;
let S={projects:[],cur:null,chat:[],provider:'anthropic'},mode='build',busy=false,ctrl=null,t0,armed=0,W;const NEWN='مشروع جديد';
const P=()=>S.projects.find(p=>p.id===S.cur);
const hist=()=>S.chat.map(m=>({role:m.c==='u'?'user':'assistant',content:m.t}));
function load(){try{const j=localStorage.getItem('studio:v1');if(j)S=Object.assign(S,JSON.parse(j))}catch(e){}}
function save(){clearTimeout(t0);t0=setTimeout(()=>{try{localStorage.setItem('studio:v1',JSON.stringify(S))}catch(e){}},300);if(remote)schedSync()}
// ---------- الحفظ على الخادم ----------
let remote=false,sent={},tS=null,syncing=false;
const sig=p=>JSON.stringify([p.name,p.html,p.brief,p.log,p.data]);
const worth=p=>!p._stub&&(p.html||p.log.length);
function setSync(t,err){const e=$('#sync');e.textContent=t;e.classList.toggle('err',!!err)}
function schedSync(){clearTimeout(tS);tS=setTimeout(syncNow,800)}
async function syncNow(){if(syncing){schedSync();return}syncing=true;let failed=false;
for(const p of S.projects){if(!worth(p))continue;const g=sig(p);if(sent[p.id]===g)continue;setSync('جارٍ الحفظ…');
try{await jfetch('/api/projects/'+p.id,'PUT',{name:p.name,html:p.html,brief:p.brief||'',log:p.log,data:p.data});sent[p.id]=g}catch(e){failed=true;setSync(e.code==='limit'?e.message:'⚠️ تعذّر الحفظ، سنعيد المحاولة',true)}}
syncing=false;if(failed)tS=setTimeout(syncNow,15000);else setSync('✓ محفوظ في حسابك')}
async function jfetch(path,method,body){const r=await fetch(path,{method,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
let j={};try{j=await r.json()}catch(e){}if(!r.ok){const err=new Error(j.message||j.error||('HTTP '+r.status));err.code=j.error;throw err}return j}
async function initRemote(){let me;try{me=await jfetch('/api/me','GET')}catch(e){return}
if(!me||me.storage!=='server')return;remote=true;$('#who').hidden=false;$('#whoMail').textContent=me.email;
let list;try{list=(await jfetch('/api/projects','GET')).projects}catch(e){setSync('⚠️ تعذّر تحميل مشاريعك من الحساب',true);return}
const local=new Map(S.projects.map(p=>[p.id,p]));const merged=[];
for(const r of list){const l=local.get(r.id);if(l){l.slug=r.slug;merged.push(l);local.delete(r.id)}else merged.push({id:r.id,name:r.name,slug:r.slug,_stub:true,html:'',log:[],data:{},brief:''})}
// المشاريع الموجودة في المتصفح فقط تُرفع للحساب تلقائياً
for(const l of local.values())if(worth(l))merged.unshift(l);
S.projects=merged;if(!P())S.cur=S.projects.length?S.projects[0].id:null;
if(!S.projects.length)newProject();else{save();openProject()}setSync('✓ محفوظ في حسابك')}
function lock(b){busy=b;const pb=document.getElementById('pub');if(pb)pb.disabled=b||!(P()&&P().html);$('#send').textContent=b?'إيقاف':'إرسال';['proj','new','del'].forEach(i=>$('#'+i).disabled=b);briefEl.readOnly=b}
const inject=(h,s)=>/<head[^>]*>/i.test(h)?h.replace(/<head[^>]*>/i,m=>m+s):s+h;
const FALL='<script>window.appDB=window.appDB||{get:function(k,f){try{var v=localStorage.getItem("appdb:"+k);return v==null?f:JSON.parse(v)}catch(e){return f}},set:function(k,v){try{localStorage.setItem("appdb:"+k,JSON.stringify(v))}catch(e){}}}<\/script>';
const ERRSHIM='<script>(function(){var n=0;function s(m){if(n++<5)parent.postMessage({apperr:String(m).slice(0,400)},"*")}addEventListener("error",function(e){s((e.message||"error")+(e.lineno?" (سطر "+e.lineno+")":""))});addEventListener("unhandledrejection",function(e){s("Promise: "+((e.reason&&e.reason.message)||e.reason))})})()<\/script>';
let appErrs=[];
const shim=d=>ERRSHIM+'<script>window.appDB=(function(){var c='+JSON.stringify(d).replace(/</g,'\\u003c')+';return{get:function(k,f){return k in c?c[k]:f},set:function(k,v){c[k]=v;parent.postMessage({appdb:1,k:k,v:v},"*")}}})()<\/script>';
addEventListener('message',e=>{const d=e.data,p=P();if(e.source!==frame.contentWindow||!d)return;if(d.apperr){appErrs.push(d.apperr);return}if(d.appdb&&p){p.data[d.k]=d.v;save()}});
function fillSel(){const s=$('#proj');s.textContent='';S.projects.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;s.appendChild(o)});s.value=S.cur}
async function openProject(){const p=P();if(!p)return;
if(p._stub){logs.build.textContent='';add('a','جارٍ تحميل المشروع…',logs.build);fillSel();
try{const f=await jfetch('/api/projects/'+p.id,'GET');Object.assign(p,{name:f.name,html:f.html,brief:f.brief,log:f.log||[],data:f.data||{},slug:f.slug});delete p._stub;sent[p.id]=sig(p);save()}
catch(e){logs.build.textContent='';add('a','⚠️ تعذّر تحميل المشروع: '+e.message,logs.build);return}
if(P()!==p)return}
briefEl.value=p.brief||'';logs.build.textContent='';add('a',W.build,logs.build);p.log.forEach(m=>add(m.c,m.t,logs.build));
if(p.html)render();else{frame.srcdoc='';codeEl.textContent='';$('#empty').hidden=false;$('#dl').disabled=true;syncPub()}fillSel()}
function rebuildChat(){logs.chat.textContent='';add('a',W.chat,logs.chat);S.chat.forEach(m=>add(m.c,m.t,logs.chat))}
function newProject(){const p={id:Date.now().toString(36),name:NEWN,html:'',log:[],data:{},brief:''};S.projects.unshift(p);S.cur=p.id;save();openProject()}

function add(c,t,l){const d=document.createElement('div');d.className='m '+c;d.textContent=t;l.appendChild(d);l.scrollTop=l.scrollHeight;return d}
function parse(t){let brief=null;const bm=/\x60\x60\x60brief[ \t]*\n([\s\S]*?)\x60\x60\x60/.exec(t);if(bm){brief=bm[1].trim();t=t.slice(0,bm.index)+t.slice(bm.index+bm[0].length)}
const o=parse0(t);o.brief=brief;return o}
function parse0(t){const m=/\x60\x60\x60(?:html)?[ \t]*\n/.exec(t);if(!m)return{msg:t.trim(),code:null};
let c=t.slice(m.index+m[0].length);const j=c.lastIndexOf(F);if(j>=0)c=c.slice(0,j);return{msg:t.slice(0,m.index).trim(),code:c.trim()}}
function render(){const p=P();appErrs=[];syncPub();frame.srcdoc=inject(p.html,shim(p.data));codeEl.textContent=p.html;$('#empty').hidden=true;$('#dl').disabled=false}
function setMode(m){mode=m;D.dataset.mode=m;document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));syncEngine();
Object.keys(logs).forEach(k=>logs[k].hidden=m!==k);$('#chips').hidden=m!=='build';$('#chipsChat').hidden=m!=='chat';$('#chipsImage').hidden=m!=='image';inp.placeholder=hints[m];$('#new').textContent=m==='build'?'＋ مشروع جديد':m==='image'?'＋ صورة جديدة':'＋ محادثة جديدة';syncBase()}

function downloadHtml(filename, content){
const blob=new Blob([content],{type:'text/html'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(url),2000);
}

const ACCESS_KEY='studio:access';
function getAccessCode(){try{return localStorage.getItem(ACCESS_KEY)||''}catch(e){return ''}}
function setAccessCode(v){try{localStorage.setItem(ACCESS_KEY,v)}catch(e){}}

async function api(path,body,signal){
const headers={'content-type':'application/json'};
const code=getAccessCode();if(code)headers['x-access-code']=code;
const r=await fetch(path,{method:'POST',headers,body:JSON.stringify(body),signal});
if(r.status===401){
const entered=prompt('هذا الموقع محمي برمز وصول. أدخل الرمز:');
if(entered){setAccessCode(entered);return api(path,body,signal);}
const err=new Error('unauthorized');err.code='not_granted';throw err;
}
if(r.status===429){const err=new Error('rate_limited');err.code='rate_limited';throw err;}
if(!r.ok){let j={};try{j=await r.json()}catch(e){}const err=new Error(j.message||j.error||('HTTP '+r.status));err.code=j.error||'server_error';throw err;}
return r.json();
}
// طلب متدفق: يعرض النص أولاً بأول ويعيد النص كاملاً في النهاية
async function apiStream(path,body,signal,onText){
const headers={'content-type':'application/json'};const code=getAccessCode();if(code)headers['x-access-code']=code;
const r=await fetch(path,{method:'POST',headers,body:JSON.stringify(Object.assign({stream:true},body)),signal});
if(r.status===401){const entered=prompt('هذا الموقع محمي برمز وصول. أدخل الرمز:');if(entered){setAccessCode(entered);return apiStream(path,body,signal,onText)}const err=new Error('unauthorized');err.code='not_granted';throw err}
if(r.status===429){const err=new Error('rate_limited');err.code='rate_limited';throw err}
if(!r.ok){let j={};try{j=await r.json()}catch(e){}const err=new Error(j.message||j.error||('HTTP '+r.status));err.code=j.error||'server_error';throw err}
if(!r.body||!/text\/plain/.test(r.headers.get('content-type')||'')){const j=await r.json();onText&&onText(j.text);return j}
const rd=r.body.getReader(),dec=new TextDecoder();let t='';
for(;;){const{done,value}=await rd.read();if(done)break;t+=dec.decode(value,{stream:true});const k=t.indexOf('\u0000ERR:');if(k>=0){const err=new Error(t.slice(k+5)||'stream_error');err.code='upstream_error';throw err}onText&&onText(t)}
return{text:t}}
const callBuild=(prompt,currentHtml,brief,signal,onText)=>apiStream('/api/build',{prompt,currentHtml,brief,provider:S.provider||'anthropic'},signal,onText);
const callChat=(messages,signal,onText)=>S.provider==='saudi'?api('/api/saudi/chat',{messages},signal):apiStream('/api/chat',{messages,provider:S.provider||'anthropic'},signal,onText);
let saudiReady=false;
function setEngine(e){S.provider=e;save();syncEngine()}
// ALLaM للمحادثة فقط: في وضع البناء يُعطَّل ويُستخدم Claude
function syncEngine(){const sb=document.querySelector('#engineSeg [data-e="saudi"]');if(!sb)return;
sb.disabled=!saudiReady||mode==='build';
sb.title=!saudiReady?'محرك ALLaM غير مفعّل بعد على الخادم':mode==='build'?'ALLaM متاح في المحادثة فقط':'نموذج ALLaM العربي المفتوح من سدايا';
if(S.provider==='saudi'&&sb.disabled)S.provider='anthropic';
document.querySelectorAll('#engineSeg button').forEach(b=>b.classList.toggle('on',b.dataset.e===S.provider))}

async function send(text,opts){opts=opts||{};
text=text.trim();if(!text||busy)return;
const l=logs[mode],m=mode,pr=P();let built=false;
add('u',opts.label||text,l);if(!opts.auto)inp.value='';
lock(true);ctrl=new AbortController();
const bub=add('a','جارٍ التفكير…',l);
try{
if(m==='image'){
const r=await api('/api/image',{prompt:text,image:baseImg||undefined,aspect:baseImg?undefined:$('#aspect').value},ctrl.signal);
bub.remove();(r.images||[]).forEach(im=>addImage(im,r.text,text));
}else if(m==='chat'){
const r=await callChat(hist().concat({role:'user',content:text}),ctrl.signal,t=>{bub.textContent=t;l.scrollTop=l.scrollHeight});
bub.textContent=r.text;S.chat.push({c:'u',t:text},{c:'a',t:r.text});save();
}else{
const r=await callBuild(text,pr.html||undefined,pr.brief||undefined,ctrl.signal,t=>{const i=t.indexOf(F);bub.textContent=(i>=0?t.slice(0,i).trim()+'\n\n':'')+'✍️ جارٍ كتابة التطبيق… '+t.length.toLocaleString('ar')+' حرف'});
const o=parse(r.text);
if(o.code&&/<\/html>/i.test(o.code)){pr.html=o.code;if(o.brief){pr.brief=o.brief;if(P()===pr)briefEl.value=o.brief}render();D.dataset.pane='preview';syncTabs();pr.log.push({c:'u',t:opts.label||text},{c:'a',t:(o.msg||'تم بناء التطبيق.')});built=true;if(pr.name===NEWN)pr.name=text.slice(0,28);save();fillSel();bub.textContent=(o.msg||'تم بناء التطبيق.')+'\n\n✅ المعاينة جاهزة، اطلب أي تعديل.'}
else bub.textContent=(o.msg||r.text)+'\n\n⚠️ لم يكتمل الكود (الناتج طويل). جرّب طلبًا أبسط أو على خطوات.';
}
}catch(e){
const c=e&&e.code;
bub.textContent=(e&&e.name==='AbortError')||c==='cancelled'?'تم الإيقاف.':
c==='not_granted'?'رمز الوصول غير صحيح.':
c==='rate_limited'?'الطلبات كثيرة، حاول بعد قليل.':
S.provider==='saudi'&&e&&e.message?e.message:
c==='missing_api_key'&&m==='image'?'الخادم لم يُضبط بمفتاح Gemini بعد (GEMINI_API_KEY).':c==='missing_api_key'&&S.provider==='gemini'?'الخادم لم يُضبط بمفتاح Gemini بعد (GEMINI_API_KEY).':c==='missing_api_key'?(S.provider==='openai'?'الخادم لم يُضبط بمفتاح OpenAI API بعد (OPENAI_API_KEY).':'الخادم لم يُضبط بمفتاح Anthropic API بعد.'):
'حدث خطأ: '+((e&&e.message)||e);
}
lock(false);syncPub();
// فحص تلقائي: إن ظهرت أخطاء في التطبيق بعد البناء، نطلب إصلاحها مرة واحدة
if(built&&!opts.auto&&P()===pr){await new Promise(r=>setTimeout(r,2500));
if(appErrs.length&&!busy&&P()===pr){const errs=[...new Set(appErrs)].slice(0,5);
send('The app shows these runtime errors in the browser console. Fix them without changing anything else. Reply in Arabic.\n- '+errs.join('\n- '),{auto:true,label:'🔧 إصلاح تلقائي: وجدت '+errs.length+' خطأ في التطبيق وأصلحها الآن…'})}}
}
function addImage(im,note,prompt){const l=logs.image,d=document.createElement('div');d.className='m a img';
const img=document.createElement('img');img.src='data:'+im.mime+';base64,'+im.data;img.alt=prompt;d.appendChild(img);
if(note){const p=document.createElement('div');p.textContent=note;d.appendChild(p)}
const acts=document.createElement('div');acts.className='acts';
const b1=document.createElement('button');b1.textContent='عدّل على هذه';b1.onclick=()=>{baseImg=im;syncBase();inp.focus()};
const b2=document.createElement('button');b2.textContent='تحميل';b2.onclick=()=>{const a=document.createElement('a');a.href=img.src;a.download='saudi-ai-'+Date.now()+'.'+(im.mime.split('/')[1]||'png');document.body.appendChild(a);a.click();a.remove()};
acts.append(b1,b2);d.appendChild(acts);l.appendChild(d);l.scrollTop=l.scrollHeight;baseImg=im;syncBase()}
function syncBase(){const b=$('#base');b.classList.toggle('show',mode==='image'&&!!baseImg);if(baseImg)b.querySelector('img').src='data:'+baseImg.mime+';base64,'+baseImg.data;$('#aspect').disabled=!!baseImg}
// تصغير الصورة المرفوعة قبل الإرسال لتسريع الطلب
function loadUpload(f){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1536/Math.max(im.width,im.height)),c=document.createElement('canvas');
c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
const u=c.toDataURL('image/jpeg',.9);baseImg={mime:'image/jpeg',data:u.split(',')[1]};syncBase();add('a','تم رفع الصورة. اكتب التعديل الذي تريده عليها.',logs.image)};im.src=fr.result};fr.readAsDataURL(f)}
function syncPub(){const p=P(),b=$('#pub'),bar=$('#pubbar');b.disabled=!p||!p.html||busy;b.textContent=p&&p.slug?'تحديث النشر':'نشر برابط';
bar.classList.toggle('show',!!(p&&p.slug));if(p&&p.slug){const u=location.origin+'/p/'+p.slug;$('#pubUrl').href=u;$('#pubUrl').textContent=u}}
async function publish(){const p=P();if(!p||!p.html)return;
if(!remote){alert('النشر برابط يتطلب تسجيل الدخول بحساب جوجل حتى يُحفظ تطبيقك على الخادم.');return}
const b=$('#pub');b.disabled=true;b.textContent='جارٍ النشر…';
try{clearTimeout(tS);await syncNow();const r=await jfetch('/api/projects/'+p.id+'/publish','POST');p.slug=r.slug;save();syncPub();add('a','🚀 تم النشر. أرسل الرابط لعملائك: '+r.url,logs.build)}
catch(e){alert('تعذّر النشر: '+e.message);syncPub()}}
async function unpublish(){const p=P();if(!p||!p.slug)return;if(!confirm('سيتوقف الرابط عن العمل لكل من لديه. متأكد؟'))return;
try{await jfetch('/api/projects/'+p.id+'/publish','DELETE');p.slug=null;save();syncPub()}catch(e){alert('تعذّر إلغاء النشر: '+e.message)}}
function syncTabs(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===D.dataset.pane))}

document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.querySelectorAll('#engineSeg button').forEach(b=>b.onclick=()=>setEngine(b.dataset.e));
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{D.dataset.pane=b.dataset.p;syncTabs()});
document.querySelectorAll('.bar [data-v]').forEach(b=>b.onclick=()=>{const v=b.dataset.v;frame.hidden=v!=='preview';codeEl.hidden=v!=='code';briefEl.hidden=v!=='brief';$('#briefNote').hidden=v!=='brief';$('#empty').style.display=v==='brief'?'none':'';
document.querySelectorAll('.bar [data-v]').forEach(x=>x.classList.toggle('on',x===b))});
$('#pub').onclick=publish;$('#pubOff').onclick=unpublish;$('#pubCopy').onclick=()=>{const u=$('#pubUrl').href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{$('#pubCopy').textContent='تم النسخ';setTimeout(()=>$('#pubCopy').textContent='نسخ',1500)}).catch(()=>prompt('انسخ الرابط:',u))};
$('#up').onclick=()=>$('#file').click();$('#file').onchange=e=>{const f=e.target.files[0];if(f)loadUpload(f);e.target.value=''};$('#baseX').onclick=()=>{baseImg=null;syncBase()};
document.querySelectorAll('#chips button,#chipsChat button,#chipsImage button').forEach(b=>b.onclick=()=>send(b.textContent));
$('#send').onclick=()=>busy?ctrl.abort():send(inp.value);
$('#proj').onchange=e=>{S.cur=e.target.value;save();openProject()};
$('#new').onclick=()=>{if(mode==='build')newProject();else if(mode==='image'){baseImg=null;syncBase();logs.image.textContent='';add('a',W.image,logs.image)}else{S.chat=[];save();rebuildChat()}};
$('#del').onclick=function(){if(!armed){this.textContent='تأكيد الحذف؟';armed=setTimeout(()=>{armed=0;this.textContent='حذف'},3000);return}
clearTimeout(armed);armed=0;this.textContent='حذف';const gone=S.cur;if(remote)jfetch('/api/projects/'+gone,'DELETE').catch(()=>{});delete sent[gone];S.projects=S.projects.filter(p=>p.id!==gone);if(S.projects.length){S.cur=S.projects[0].id;save();openProject()}else newProject()};
briefEl.oninput=()=>{const p=P();if(p){p.brief=briefEl.value;save()}};
inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!busy)send(inp.value)}};
$('#dl').onclick=()=>{const p=P();if(p&&p.html)downloadHtml((p.name.replace(/[^\w؀-ۿ -]/g,'').trim()||'my-app')+'.html',inject(p.html,FALL));};

add('a','أهلًا! صف لي التطبيق الذي تريده وسأبنيه وأعرضه لك فورًا، ثم عدّل عليه بالمحادثة مثل: «غيّر الألوان» أو «أضف صفحة إحصائيات».',logs.build);
add('a','جرّب إحدى الأدوات السريعة بالأسفل، أو اكتب سؤالك مباشرة.',logs.chat);
add('a','صف الصورة التي تريدها وسأصممها لك عبر Nano Banana من جوجل. بعدها اطلب أي تعديل عليها، أو ارفع صورتك وعدّل عليها.',logs.image);
W={build:logs.build.firstChild.textContent,chat:logs.chat.firstChild.textContent,image:logs.image.firstChild.textContent};load();P()?openProject():newProject();rebuildChat();setMode('build');initRemote();
setEngine(S.provider||'anthropic');

fetch('/api/saudi/status').then(r=>r.ok?r.json():{}).then(j=>{saudiReady=!!j.enabled;syncEngine()}).catch(()=>{});
fetch('/api/health').then(r=>r.json()).then(h=>{
if(!h.hasOpenAIKey){const b=document.querySelector('#engineSeg [data-e="openai"]');if(b){b.disabled=true;b.title='لم يُضبط OPENAI_API_KEY بعد في الاستضافة'}}
if(!h.hasGeminiKey){const b=document.querySelector('#engineSeg [data-e="gemini"]');if(b){b.disabled=true;b.title='لم يُضبط GEMINI_API_KEY بعد في الاستضافة'}if(S.provider==='gemini')setEngine('anthropic')}
const activeMissing=S.provider==='saudi'||S.provider==='gemini'?false:(S.provider==='openai')?!h.hasOpenAIKey:!h.hasApiKey;
if(activeMissing){const b=$('#banner');b.textContent=S.provider==='openai'?'⚠️ لم يُضبط بعد مفتاح OpenAI API (OPENAI_API_KEY) لهذا المحرك.':'⚠️ الخادم يعمل لكن لم يُضبط بعد بمفتاح Anthropic API (ANTHROPIC_API_KEY). أضفه في إعدادات الاستضافة.';b.classList.add('show');}
}).catch(()=>{const b=$('#banner');b.textContent='⚠️ لا يمكن الوصول لخادم الأداة الآن. تأكد أن الخادم (server.js) يعمل.';b.classList.add('show');});
