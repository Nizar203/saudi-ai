<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سعودي AI</title>
<meta name="google-adsense-account" content="ca-pub-1829540228262969">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
/* سعودي AI — هوية: أخضر العلم، نحاس الدلّة، وشريط مستوحى من نسيج السدو */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2ef;--panel:#ffffff;--ink:#132019;--mute:#5f6e66;--line:#d7e0da;
--accent:#006c35;--accent-ink:#ffffff;--accent-soft:#e1efe6;--brass:#b8892b;--user:#e1efe6;--canvas:#e4eae6;--danger:#9b2c2c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1612;--panel:#142019;--ink:#e9f0ec;--mute:#93a59b;--line:#24342b;
--accent:#2fb36b;--accent-ink:#06150d;--accent-soft:#183326;--brass:#d6a947;--user:#183326;--canvas:#0a120e;--danger:#e07a7a}}
:root[data-theme="dark"]{--bg:#0d1612;--panel:#142019;--ink:#e9f0ec;--mute:#93a59b;--line:#24342b;
--accent:#2fb36b;--accent-ink:#06150d;--accent-soft:#183326;--brass:#d6a947;--user:#183326;--canvas:#0a120e;--danger:#e07a7a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
font:15px/1.65 "IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* الرأس */
header{display:flex;align-items:center;gap:20px;padding:12px 20px;background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.brand .mark svg{width:20px;height:20px}
.brand b{font:700 1.35rem/1 "Reem Kufi","IBM Plex Sans Arabic",sans-serif;letter-spacing:0}
.brand small{font:600 .8rem/1 "IBM Plex Sans Arabic",sans-serif;color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:6px;direction:ltr}
nav.main{display:flex;gap:2px;margin-inline-start:auto;background:var(--bg);padding:3px;border-radius:12px}
nav.main button,nav.main a{font:500 .92rem/1 inherit;font-family:inherit;border:0;background:transparent;color:var(--mute);padding:9px 14px;border-radius:9px;text-decoration:none;cursor:pointer;white-space:nowrap}
nav.main button:hover,nav.main a:hover{color:var(--ink)}
nav.main button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(19,32,25,.12)}
.sadu{height:6px;flex:none;background:
linear-gradient(135deg,var(--brass) 25%,transparent 25%) 0 0/12px 6px,
linear-gradient(225deg,var(--brass) 25%,transparent 25%) 0 0/12px 6px,
var(--accent)}

/* أزرار عامة */
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 13px}
button:hover:not(:disabled){border-color:var(--mute)}
button.on,#send{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:11px}
.seg button{border:0;background:transparent;color:var(--mute);padding:5px 12px;border-radius:8px;font-size:.88rem}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(19,32,25,.12)}

/* شريط الأدوات: المحرك + المشروع في سطر واحد */
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
#enginebar{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute)}
#projbar{display:flex;gap:6px;flex:1;min-width:240px;max-width:560px;margin-inline-start:auto}
#proj{flex:1;min-width:0;font:inherit;font-size:.9rem;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
#projbar button{font-size:.88rem}
#del{color:var(--mute)}
body[data-mode=chat] #proj,body[data-mode=chat] #del{display:none}
body[data-mode=chat] #projbar{flex:none;min-width:0}
#banner{display:none;padding:9px 20px;font-size:.88rem;background:#5a1f1f;color:#fff}
#banner.show{display:block}

/* المساحة الرئيسية */
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(320px,2fr) 3fr}
#chatp{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-inline-end:1px solid var(--line)}
.log{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-start;background:var(--user);border-start-start-radius:4px}
.m.a{align-self:flex-end;background:var(--bg);border-start-end-radius:4px}
#chips,#chipsChat{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 10px}
#chips button,#chipsChat button{font-size:.84rem;border-radius:99px;color:var(--mute);background:transparent;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chips button:hover,#chipsChat button:hover{color:var(--ink);background:var(--accent-soft);border-color:var(--accent-soft)}
.comp{display:flex;gap:8px;align-items:flex-end;margin:0 16px 16px;padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.comp:focus-within{border-color:var(--accent)}
textarea{flex:1;resize:none;font:inherit;color:inherit;background:transparent;border:0;padding:6px 8px;max-height:140px;outline:none}
#send{border-radius:11px;padding:9px 18px;font-weight:600}

/* المعاينة: التطبيق يظهر كصفحة على لوحة */
#prev{display:flex;flex-direction:column;min-height:0;position:relative;background:var(--canvas);
background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.bar{display:flex;gap:6px;align-items:center;padding:10px 16px}
.bar [data-v]{border:0;background:transparent;color:var(--mute);padding:6px 12px}
.bar [data-v].on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(19,32,25,.12)}
.bar .sp{flex:1}
#dl{background:var(--panel)}
#frame,#code{flex:1;margin:0 16px 16px;border-radius:14px;border:1px solid var(--line);box-shadow:0 10px 30px -18px rgba(19,32,25,.45)}
#frame{width:calc(100% - 32px);background:#fff}
#code{padding:14px;overflow:auto;direction:ltr;text-align:left;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;background:var(--panel)}
#empty{position:absolute;inset:56px 16px 16px;display:grid;place-items:center;align-content:center;gap:6px;color:var(--mute);text-align:center;padding:20px;pointer-events:none;border:1.5px dashed var(--line);border-radius:14px}
#empty b{font:700 1.15rem "Reem Kufi","IBM Plex Sans Arabic",sans-serif;color:var(--ink)}
#tabs{display:none;gap:6px;padding:8px;border-top:1px solid var(--line);background:var(--panel)}
#tabs button{flex:1}

body[data-mode=chat] main{grid-template-columns:1fr}
body[data-mode=chat] #chatp{max-width:820px;width:100%;margin:0 auto;border:0;background:transparent}
body[data-mode=chat] .m.a{background:var(--panel)}
body[data-mode=chat] #prev{display:none}

@media (max-width:800px){
header{gap:10px;padding:10px 12px;flex-wrap:wrap}
nav.main{margin-inline-start:0;width:100%;overflow-x:auto}
nav.main button,nav.main a{flex:1;padding:9px 8px;text-align:center}
#toolbar{padding:8px 12px}
#projbar{min-width:100%;margin:0}
main{grid-template-columns:1fr}
.log{padding:14px}
body[data-mode=build] #tabs{display:flex}
body[data-mode=build][data-pane=chat] #prev{display:none}
body[data-mode=build][data-pane=preview] #chatp{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-mode="build" data-pane="chat">
<div id="app">
<header>
<a class="brand" href="/" aria-label="سعودي AI">
<span class="mark" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 2 18 10 10 18 2 10Z" fill="none" stroke="#fff" stroke-width="2"/><path d="M10 6.5 13.5 10 10 13.5 6.5 10Z" fill="#d6a947"/></svg></span>
<b>سعودي</b><small>AI</small>
</a>
<nav class="main" id="modeSeg" aria-label="الخدمات">
<button data-m="build" class="on">بناء تطبيق</button>
<button data-m="chat">محادثة</button>
<a href="/domains.html">دومينات</a>
</nav>
</header>
<div class="sadu" aria-hidden="true"></div>
<div id="banner"></div>
<div id="toolbar">
<div id="enginebar"><span>المحرك</span><div class="seg" id="engineSeg"><button data-e="anthropic" class="on">Claude</button><button data-e="openai">ChatGPT</button><button data-e="saudi" title="نموذج ALLaM العربي المفتوح من سدايا، للمحادثة فقط">ALLaM</button></div></div>
<div id="projbar"><select id="proj" aria-label="المشروع"></select><button id="new"></button><button id="del">حذف</button></div>
</div>
<main>
<section id="chatp">
<div class="log" id="log-build"></div>
<div class="log" id="log-chat" hidden></div>
<div id="chips">
<button>تطبيق مهام أنيق مع تصنيفات</button>
<button>لعبة ذاكرة بالبطاقات</button>
<button>حاسبة مصاريف شهرية مع رسم بياني</button>
</div>
<div id="chipsChat" hidden>
<button>ترجم هذه الجملة إلى الإنجليزية: نحن نقدم أفضل الأسعار وأسرع توصيل</button>
<button>لخّص هذا النص في سطرين: يشهد قطاع التجارة الإلكترونية في السعودية نموًا متسارعًا بسبب زيادة استخدام الجوال وسهولة الدفع الإلكتروني وثقة المستهلكين المتنامية بالتسوق عبر الإنترنت</button>
<button>اكتب منشورًا تسويقيًا لافتتاح مطعم جديد</button>
<button>اقترح 5 أفكار لمشروع صغير برأس مال محدود</button>
<button>اكتب ردًا مهذبًا على شكوى عميل من تأخر التوصيل</button>
<button>اشرح لي كيف أحسب هامش الربح على منتج</button>
</div>
<div class="comp">
<textarea id="inp" rows="2" dir="auto"></textarea>
<button id="send">إرسال</button>
</div>
</section>
<section id="prev">
<div class="bar">
<button data-v="preview" class="on">معاينة</button>
<button data-v="code">الكود</button>
<span class="sp"></span>
<button id="dl" disabled>تحميل HTML</button>
</div>
<iframe id="frame" sandbox="allow-scripts allow-forms allow-modals" title="preview"></iframe>
<pre id="code" hidden></pre>
<div id="empty"><b>المعاينة</b><span>اكتب وصف تطبيقك في المحادثة وسيظهر هنا جاهزاً للتجربة</span></div>
</section>
</main>
<nav id="tabs"><button data-p="chat" class="on">المحادثة</button><button data-p="preview">المعاينة</button></nav>
</div>
<script>
const $=s=>document.querySelector(s),D=document.body,F='\x60\x60\x60';
const logs={build:$('#log-build'),chat:$('#log-chat')},inp=$('#inp'),frame=$('#frame'),codeEl=$('#code');
const hints={build:'صف التطبيق الذي تريده، أو اطلب تعديلًا على الحالي…',chat:'اسأل أي شيء…'};
let S={projects:[],cur:null,chat:[],provider:'anthropic'},mode='build',busy=false,ctrl=null,t0,armed=0,W;const NEWN='مشروع جديد';
const P=()=>S.projects.find(p=>p.id===S.cur);
const hist=()=>S.chat.map(m=>({role:m.c==='u'?'user':'assistant',content:m.t}));
function load(){try{const j=localStorage.getItem('studio:v1');if(j)S=Object.assign(S,JSON.parse(j))}catch(e){}}
function save(){clearTimeout(t0);t0=setTimeout(()=>{try{localStorage.setItem('studio:v1',JSON.stringify(S))}catch(e){}},300)}
function lock(b){busy=b;$('#send').textContent=b?'إيقاف':'إرسال';['proj','new','del'].forEach(i=>$('#'+i).disabled=b)}
const inject=(h,s)=>/<head[^>]*>/i.test(h)?h.replace(/<head[^>]*>/i,m=>m+s):s+h;
const FALL='<script>window.appDB=window.appDB||{get:function(k,f){try{var v=localStorage.getItem("appdb:"+k);return v==null?f:JSON.parse(v)}catch(e){return f}},set:function(k,v){try{localStorage.setItem("appdb:"+k,JSON.stringify(v))}catch(e){}}}<\/script>';
const shim=d=>'<script>window.appDB=(function(){var c='+JSON.stringify(d).replace(/</g,'\\u003c')+';return{get:function(k,f){return k in c?c[k]:f},set:function(k,v){c[k]=v;parent.postMessage({appdb:1,k:k,v:v},"*")}}})()<\/script>';
addEventListener('message',e=>{const d=e.data,p=P();if(e.source===frame.contentWindow&&d&&d.appdb&&p){p.data[d.k]=d.v;save()}});
function fillSel(){const s=$('#proj');s.textContent='';S.projects.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;s.appendChild(o)});s.value=S.cur}
function openProject(){const p=P();logs.build.textContent='';add('a',W.build,logs.build);p.log.forEach(m=>add(m.c,m.t,logs.build));
if(p.html)render();else{frame.srcdoc='';codeEl.textContent='';$('#empty').hidden=false;$('#dl').disabled=true}fillSel()}
function rebuildChat(){logs.chat.textContent='';add('a',W.chat,logs.chat);S.chat.forEach(m=>add(m.c,m.t,logs.chat))}
function newProject(){const p={id:Date.now().toString(36),name:NEWN,html:'',log:[],data:{}};S.projects.unshift(p);S.cur=p.id;save();openProject()}

function add(c,t,l){const d=document.createElement('div');d.className='m '+c;d.textContent=t;l.appendChild(d);l.scrollTop=l.scrollHeight;return d}
function parse(t){const m=/\x60\x60\x60(?:html)?[ \t]*\n/.exec(t);if(!m)return{msg:t.trim(),code:null};
let c=t.slice(m.index+m[0].length);const j=c.lastIndexOf(F);if(j>=0)c=c.slice(0,j);return{msg:t.slice(0,m.index).trim(),code:c.trim()}}
function render(){const p=P();frame.srcdoc=inject(p.html,shim(p.data));codeEl.textContent=p.html;$('#empty').hidden=true;$('#dl').disabled=false}
function setMode(m){mode=m;D.dataset.mode=m;document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));syncEngine();
logs.build.hidden=m!=='build';logs.chat.hidden=m!=='chat';$('#chips').hidden=m!=='build';$('#chipsChat').hidden=m!=='chat';inp.placeholder=hints[m];$('#new').textContent=m==='build'?'＋ مشروع جديد':'＋ محادثة جديدة'}

function downloadHtml(filename, content){
const blob=new Blob([content],{type:'text/html'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(url),2000);
}

const ACCESS_KEY='studio:access';
function getAccessCode(){try{return localStorage.getItem(ACCESS_KEY)||''}catch(e){return ''}}
function setAccessCode(v){try{localStorage.setItem(ACCESS_KEY,v)}catch(e){}}

async function api(path,body,signal){
const headers={'content-type':'application/json'};
const code=getAccessCode();if(code)headers['x-access-code']=code;
const r=await fetch(path,{method:'POST',headers,body:JSON.stringify(body),signal});
if(r.status===401){
const entered=prompt('هذا الموقع محمي برمز وصول. أدخل الرمز:');
if(entered){setAccessCode(entered);return api(path,body,signal);}
const err=new Error('unauthorized');err.code='not_granted';throw err;
}
if(r.status===429){const err=new Error('rate_limited');err.code='rate_limited';throw err;}
if(!r.ok){let j={};try{j=await r.json()}catch(e){}const err=new Error(j.message||j.error||('HTTP '+r.status));err.code=j.error||'server_error';throw err;}
return r.json();
}
const callBuild=(prompt,currentHtml,signal)=>api('/api/build',{prompt,currentHtml,provider:S.provider||'anthropic'},signal);
const callChat=(messages,signal)=>S.provider==='saudi'?api('/api/saudi/chat',{messages},signal):api('/api/chat',{messages,provider:S.provider||'anthropic'},signal);
let saudiReady=false;
function setEngine(e){S.provider=e;save();syncEngine()}
// ALLaM للمحادثة فقط: في وضع البناء يُعطَّل ويُستخدم Claude
function syncEngine(){const sb=document.querySelector('#engineSeg [data-e="saudi"]');if(!sb)return;
sb.disabled=!saudiReady||mode==='build';
sb.title=!saudiReady?'محرك ALLaM غير مفعّل بعد على الخادم':mode==='build'?'ALLaM متاح في المحادثة فقط':'نموذج ALLaM العربي المفتوح من سدايا';
if(S.provider==='saudi'&&sb.disabled)S.provider='anthropic';
document.querySelectorAll('#engineSeg button').forEach(b=>b.classList.toggle('on',b.dataset.e===S.provider))}

async function send(text){
text=text.trim();if(!text||busy)return;
const l=logs[mode],m=mode,pr=P();
add('u',text,l);inp.value='';
lock(true);ctrl=new AbortController();
const bub=add('a','جارٍ التفكير…',l);
try{
if(m==='chat'){
const r=await callChat(hist().concat({role:'user',content:text}),ctrl.signal);
bub.textContent=r.text;S.chat.push({c:'u',t:text},{c:'a',t:r.text});save();
}else{
const r=await callBuild(text,pr.html||undefined,ctrl.signal);
const o=parse(r.text);
if(o.code&&/<\/html>/i.test(o.code)){pr.html=o.code;render();D.dataset.pane='preview';syncTabs();pr.log.push({c:'u',t:text},{c:'a',t:(o.msg||'تم بناء التطبيق.')});if(pr.name===NEWN)pr.name=text.slice(0,28);save();fillSel();bub.textContent=(o.msg||'تم بناء التطبيق.')+'\n\n✅ المعاينة جاهزة، اطلب أي تعديل.'}
else bub.textContent=(o.msg||r.text)+'\n\n⚠️ لم يكتمل الكود (الناتج طويل). جرّب طلبًا أبسط أو على خطوات.';
}
}catch(e){
const c=e&&e.code;
bub.textContent=(e&&e.name==='AbortError')||c==='cancelled'?'تم الإيقاف.':
c==='not_granted'?'رمز الوصول غير صحيح.':
c==='rate_limited'?'الطلبات كثيرة، حاول بعد قليل.':
S.provider==='saudi'&&e&&e.message?e.message:
c==='missing_api_key'?(S.provider==='openai'?'الخادم لم يُضبط بمفتاح OpenAI API بعد (OPENAI_API_KEY).':'الخادم لم يُضبط بمفتاح Anthropic API بعد.'):
'حدث خطأ: '+((e&&e.message)||e);
}
lock(false);
}
function syncTabs(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===D.dataset.pane))}

document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.querySelectorAll('#engineSeg button').forEach(b=>b.onclick=()=>setEngine(b.dataset.e));
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{D.dataset.pane=b.dataset.p;syncTabs()});
document.querySelectorAll('.bar [data-v]').forEach(b=>b.onclick=()=>{const c=b.dataset.v==='code';frame.hidden=c;codeEl.hidden=!c;
document.querySelectorAll('.bar [data-v]').forEach(x=>x.classList.toggle('on',x===b))});
document.querySelectorAll('#chips button,#chipsChat button').forEach(b=>b.onclick=()=>send(b.textContent));
$('#send').onclick=()=>busy?ctrl.abort():send(inp.value);
$('#proj').onchange=e=>{S.cur=e.target.value;save();openProject()};
$('#new').onclick=()=>{if(mode==='build')newProject();else{S.chat=[];save();rebuildChat()}};
$('#del').onclick=function(){if(!armed){this.textContent='تأكيد الحذف؟';armed=setTimeout(()=>{armed=0;this.textContent='حذف'},3000);return}
clearTimeout(armed);armed=0;this.textContent='حذف';S.projects=S.projects.filter(p=>p.id!==S.cur);if(S.projects.length){S.cur=S.projects[0].id;save();openProject()}else newProject()};
inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!busy)send(inp.value)}};
$('#dl').onclick=()=>{const p=P();if(p&&p.html)downloadHtml((p.name.replace(/[^\w؀-ۿ -]/g,'').trim()||'my-app')+'.html',inject(p.html,FALL));};

add('a','أهلًا! صف لي التطبيق الذي تريده وسأبنيه وأعرضه لك فورًا، ثم عدّل عليه بالمحادثة مثل: «غيّر الألوان» أو «أضف صفحة إحصائيات».',logs.build);
add('a','جرّب إحدى الأدوات السريعة بالأسفل، أو اكتب سؤالك مباشرة.',logs.chat);

fetch('/api/saudi/status').then(r=>r.ok?r.json():{}).then(j=>{saudiReady=!!j.enabled;syncEngine()}).catch(()=>{});
fetch('/api/health').then(r=>r.json()).then(h=>{
if(!h.hasOpenAIKey){const b=document.querySelector('#engineSeg [data-e="openai"]');if(b){b.disabled=true;b.title='لم يُضبط OPENAI_API_KEY بعد في الاستضافة'}}
const activeMissing=S.provider==='saudi'?false:(S.provider==='openai')?!h.hasOpenAIKey:!h.hasApiKey;
if(activeMissing){const b=$('#banner');b.textContent=S.provider==='openai'?'⚠️ لم يُضبط بعد مفتاح OpenAI API (OPENAI_API_KEY) لهذا المحرك.':'⚠️ الخادم يعمل لكن لم يُضبط بعد بمفتاح Anthropic API (ANTHROPIC_API_KEY). أضفه في إعدادات الاستضافة.';b.classList.add('show');}
}).catch(()=>{const b=$('#banner');b.textContent='⚠️ لا يمكن الوصول لخادم الأداة الآن. تأكد أن الخادم (server.js) يعمل.';b.classList.add('show');});
