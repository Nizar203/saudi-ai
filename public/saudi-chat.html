<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دومينات سعودي AI</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8f6;--card:#fff;--ink:#14231b;--muted:#5d6f64;--line:#dfe7e1;--green:#0b7a43;--green-2:#e7f4ec;--red:#b3261e;--amber:#9a6200}
@media (prefers-color-scheme:dark){:root{--bg:#0e1511;--card:#16201a;--ink:#e8f0eb;--muted:#9bb0a3;--line:#27342c;--green:#3cc17c;--green-2:#173324;--red:#ff8a80;--amber:#ffc266}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:40px 16px 80px}
h1{font-size:clamp(1.6rem,4vw,2.2rem);margin:0 0 6px}
p.sub{color:var(--muted);margin:0 0 24px}
form.search{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
form.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.1rem;padding:10px;direction:ltr;text-align:left;outline:none;min-width:0}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--green);color:#fff}
button.ghost{background:var(--green-2);color:var(--green)}
button:disabled{opacity:.5;cursor:default}
#results{margin-top:20px;display:grid;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;flex-wrap:wrap}
.dom{direction:ltr;font-weight:700;font-size:1.05rem;word-break:break-all}
.price{color:var(--green);font-weight:700}
.taken{color:var(--muted)} .warn{color:var(--amber)} .err{color:var(--red)}
.right{display:flex;align-items:center;gap:12px}
small{color:var(--muted)}
details{margin-top:48px;border-top:1px solid var(--line);padding-top:16px}
summary{cursor:pointer;color:var(--muted)}
.admin{display:grid;gap:8px;margin-top:12px}
.admin input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);direction:ltr}
pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;direction:ltr;text-align:left;font-size:.85rem;max-height:300px}
</style>
</head>
<body>
<main>
  <h1>احجز اسم موقعك</h1>
  <p class="sub">ابحث عن الدومين، واطلبه، ونربطه بتطبيقك في سعودي AI.</p>

  <form class="search" id="f">
    <input id="q" placeholder="myshop" autocomplete="off" aria-label="اسم الدومين">
    <button id="go">ابحث</button>
  </form>
  <div id="results" aria-live="polite"></div>

  <details>
    <summary>لوحة المدير</summary>
    <div class="admin">
      <input id="tok" type="password" placeholder="رمز المدير">
      <input id="adom" placeholder="example.com">
      <input id="atarget" placeholder="my-app.onrender.com (للربط)">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="ghost" data-a="balance">الرصيد</button>
        <button class="ghost" data-a="preview">معاينة التسجيل</button>
        <button data-a="register">تسجيل فعلي</button>
        <button class="ghost" data-a="point">ربط بالموقع</button>
      </div>
      <pre id="out">—</pre>
    </div>
  </details>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('#f').onsubmit = async e => {
  e.preventDefault();
  const q = $('#q').value.trim();
  if (!q) return;
  $('#go').disabled = true;
  $('#results').innerHTML = '<small>جارٍ الفحص…</small>';
  try {
    const r = await fetch('/api/domains/check?q=' + encodeURIComponent(q));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    $('#results').innerHTML = d.results.map(x => {
      let right;
      if (x.status === 'available') right = `<span class="price">${x.priceSar} ريال/سنة</span><button data-d="${esc(x.domain)}" data-p="${x.priceSar}">اطلبه</button>`;
      else if (x.status === 'taken') right = '<span class="taken">محجوز</span>';
      else if (x.status === 'premium') right = '<span class="warn">مميّز — تواصل معنا</span>';
      else if (x.status === 'retry') right = '<span class="warn">لم يُعرف، أعد المحاولة</span>';
      else right = '<span class="taken">غير مدعوم</span>';
      return `<div class="row"><span class="dom">${esc(x.domain)}</span><span class="right">${right}</span></div>`;
    }).join('');
  } catch (err) {
    $('#results').innerHTML = `<div class="err">${esc(err.message || 'حدث خطأ')}</div>`;
  } finally { $('#go').disabled = false; }
};

$('#results').onclick = async e => {
  const b = e.target.closest('button[data-d]');
  if (!b) return;
  const name = prompt('اسمك (لإكمال الطلب):') || '';
  const r = await fetch('/api/domains/order', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({domain: b.dataset.d, priceSar: b.dataset.p, name})});
  const d = await r.json();
  if (d.whatsapp) location.href = d.whatsapp; else alert(d.error || 'خطأ');
};

document.querySelector('.admin').onclick = async e => {
  const a = e.target.dataset?.a;
  if (!a) return;
  if (a === 'register' && !confirm('سيُخصم المبلغ من رصيد Porkbun. متأكد؟')) return;
  const h = {'Content-Type':'application/json','x-admin-token': $('#tok').value};
  const domain = $('#adom').value.trim();
  let r;
  if (a === 'balance') r = await fetch('/api/domains/admin/balance', {headers:h});
  else if (a === 'point') r = await fetch('/api/domains/admin/point', {method:'POST',headers:h,body:JSON.stringify({domain,target:$('#atarget').value})});
  else r = await fetch('/api/domains/admin/register', {method:'POST',headers:h,body:JSON.stringify({domain,confirm:a==='register'})});
  $('#out').textContent = JSON.stringify(await r.json(), null, 2);
};
</script>
</body>
</html>
